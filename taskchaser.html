<title>TaskChaser</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
:root{
  --paper:#F6F7F9; --surface:#FFFFFF; --surface-2:#EEF1F5;
  --rule:#DDE2EA; --rule-strong:#C6CEDA;
  --ink:#131923; --ink-2:#4A5566; --ink-3:#7B8698;
  --accent:#2B4C8C; --accent-2:#E7EDF8; --accent-3:#1D3665; --on-accent:#FFFFFF;
  --ready:#2C6B52; --ready-bg:#E3F0E9;
  --soon:#8A6410; --soon-bg:#F7EEDA;
  --late:#A33B2C; --late-bg:#F8E6E2;
  --blocked:#65568C; --blocked-bg:#EDE9F5;
  --shadow:0 1px 2px rgba(19,25,35,.06), 0 10px 28px rgba(19,25,35,.07);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,ui-serif,serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono","Roboto Mono",ui-monospace,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1219; --surface:#151A23; --surface-2:#1C222D;
    --rule:#262E3B; --rule-strong:#3A4453;
    --ink:#E6EAF1; --ink-2:#A3AEBF; --ink-3:#778399;
    --accent:#8AA9EC; --accent-2:#1D2740; --accent-3:#B6C8F3; --on-accent:#0E1219;
    --ready:#6FC49B; --ready-bg:#16281F;
    --soon:#DCB264; --soon-bg:#2A2216;
    --late:#E68C74; --late-bg:#2E1C19;
    --blocked:#AE9CDC; --blocked-bg:#221D30;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.38);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1219; --surface:#151A23; --surface-2:#1C222D;
  --rule:#262E3B; --rule-strong:#3A4453;
  --ink:#E6EAF1; --ink-2:#A3AEBF; --ink-3:#778399;
  --accent:#8AA9EC; --accent-2:#1D2740; --accent-3:#B6C8F3; --on-accent:#0E1219;
  --ready:#6FC49B; --ready-bg:#16281F;
  --soon:#DCB264; --soon-bg:#2A2216;
  --late:#E68C74; --late-bg:#2E1C19;
  --blocked:#AE9CDC; --blocked-bg:#221D30;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.38);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}

/* ---------- shell ---------- */
.shell{max-width:1180px; margin:0 auto; padding:0 20px 80px}
header.top{
  position:sticky; top:0; z-index:40; background:var(--paper);
  border-bottom:1px solid var(--rule); padding:14px 0 0;
}
.brandline{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
.brand{
  font-family:var(--serif); font-size:23px; font-weight:600; letter-spacing:-.01em;
  display:flex; align-items:baseline; gap:8px;
}
.brand em{font-style:normal; color:var(--accent)}
.tagline{color:var(--ink-3); font-size:12.5px; letter-spacing:.02em}
.topright{margin-left:auto; display:flex; gap:8px; align-items:center}

.quickbar{display:flex; gap:8px; margin:12px 0 12px; flex-wrap:wrap}
.quickbar form{display:flex; gap:8px; flex:1 1 460px; min-width:0}
.qinput{
  flex:1 1 auto; min-width:0; background:var(--surface); border:1px solid var(--rule-strong);
  border-radius:var(--r); padding:9px 12px; box-shadow:var(--shadow);
}
.qinput::placeholder{color:var(--ink-3)}
.searchwrap{display:flex; gap:8px; flex:0 1 260px}
.searchwrap input{
  width:100%; background:var(--surface); border:1px solid var(--rule); border-radius:var(--r); padding:9px 12px;
}

nav.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:thin}
nav.tabs button{
  background:none; border:0; border-bottom:2px solid transparent; padding:9px 13px;
  color:var(--ink-2); cursor:pointer; white-space:nowrap; font-size:14px; letter-spacing:.01em;
}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:600}
nav.tabs .count{
  font-family:var(--mono); font-size:11px; margin-left:6px; padding:1px 5px; border-radius:20px;
  background:var(--surface-2); color:var(--ink-2);
}
nav.tabs button[aria-current="true"] .count{background:var(--accent-2); color:var(--accent)}
nav.tabs .count.hot{background:var(--late-bg); color:var(--late)}

/* ---------- buttons ---------- */
.btn{
  background:var(--surface); border:1px solid var(--rule-strong); border-radius:var(--r);
  padding:8px 13px; cursor:pointer; color:var(--ink); white-space:nowrap;
}
.btn:hover{border-color:var(--ink-3); background:var(--surface-2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 9px; font-size:13px}
a.btn{display:inline-block; text-decoration:none}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.danger{color:var(--late); border-color:var(--late)}

/* ---------- panels ---------- */
.panel{
  background:var(--surface); border:1px solid var(--rule); border-radius:8px;
  box-shadow:var(--shadow); margin-top:18px; overflow:hidden;
}
.panel > h2, .panel > .phead{
  margin:0; padding:14px 18px; border-bottom:1px solid var(--rule);
  font-family:var(--serif); font-size:17px; font-weight:600;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.phead .sub{font-family:var(--sans); font-size:12.5px; color:var(--ink-3); font-weight:400}
.pbody{padding:18px}
.pbody.tight{padding:0}

/* ---------- summary strip ---------- */
.tally{display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:8px; overflow:hidden; margin-top:18px}
.tally > div{background:var(--surface); padding:13px 15px}
.tally .n{font-family:var(--mono); font-size:24px; font-variant-numeric:tabular-nums; line-height:1.15}
.tally .k{font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); margin-top:2px}
.tally .late .n{color:var(--late)} .tally .soon .n{color:var(--soon)}
.tally .ready .n{color:var(--ready)} .tally .blocked .n{color:var(--blocked)}

/* ---------- ledger rows ---------- */
.rowhead, .row{
  display:grid; grid-template-columns:4px 1.7fr 128px 92px 62px 104px;
  gap:14px; align-items:center; padding:11px 18px 11px 0;
}
.rowhead{
  padding-top:9px; padding-bottom:9px; border-bottom:1px solid var(--rule);
  font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3); background:var(--surface-2);
}
.row{border-bottom:1px solid var(--rule); cursor:pointer; background:var(--surface)}
.row > div{min-width:0}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.stripe{width:4px; height:38px; border-radius:0 3px 3px 0; background:var(--rule-strong)}
.row[data-s="late"] .stripe{background:var(--late)}
.row[data-s="soon"] .stripe{background:var(--soon)}
.row[data-s="ready"] .stripe{background:var(--ready)}
.row[data-s="blocked"] .stripe{background:var(--blocked)}
.row[data-s="open"] .stripe{background:var(--rule-strong)}
.who{font-weight:600; font-size:14px}
.what{color:var(--ink-2); font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--ink-2)}
.chip{
  display:inline-block; font-family:var(--mono); font-size:11.5px; padding:2px 7px; border-radius:20px;
  background:var(--surface-2); color:var(--ink-2); white-space:nowrap;
}
.chip.late{background:var(--late-bg); color:var(--late)}
.chip.soon{background:var(--soon-bg); color:var(--soon)}
.chip.ready{background:var(--ready-bg); color:var(--ready)}
.chip.blocked{background:var(--blocked-bg); color:var(--blocked)}
.chip.accent{background:var(--accent-2); color:var(--accent)}
.rowacts{display:flex; gap:6px; justify-content:flex-end}
.empty{padding:44px 18px; text-align:center; color:var(--ink-3)}
.empty h3{font-family:var(--serif); color:var(--ink); font-size:19px; margin:0 0 6px}

@media (max-width:860px){
  .rowhead{display:none}
  .row{grid-template-columns:4px 1fr auto; grid-template-areas:"s a c" "s b d"; row-gap:4px; padding-right:14px}
  .row .stripe{grid-area:s; height:100%}
  .row .cell-main{grid-area:a}
  .row .cell-due{grid-area:b}
  .row .cell-days{grid-area:c; justify-self:end}
  .row .cell-chase{display:none}
  .row .rowacts{grid-area:d; justify-self:end}
}

/* ---------- forms ---------- */
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px}
label.f{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); margin-bottom:5px}
input.t, textarea.t, select.t{
  width:100%; background:var(--paper); border:1px solid var(--rule-strong); border-radius:var(--r); padding:8px 11px;
}
textarea.t{min-height:90px; resize:vertical; font-family:var(--mono); font-size:13px; line-height:1.55}
.hint{font-size:12.5px; color:var(--ink-3); margin-top:6px}
.formrow{margin-bottom:14px}
.actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px}

/* ---------- drawer ---------- */
.scrim{position:fixed; inset:0; background:rgba(10,14,20,.44); z-index:60; opacity:0; pointer-events:none; transition:opacity .16s}
.scrim.on{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; right:0; height:100%; width:min(560px,100%); z-index:61;
  background:var(--surface); border-left:1px solid var(--rule); box-shadow:var(--shadow);
  transform:translateX(102%); transition:transform .2s ease; display:flex; flex-direction:column;
}
.drawer.on{transform:none}
.dhead{padding:16px 20px; border-bottom:1px solid var(--rule); display:flex; gap:12px; align-items:flex-start}
.dhead h3{margin:0; font-family:var(--serif); font-size:20px; line-height:1.25}
.dbody{padding:20px; overflow-y:auto; flex:1}
.stamp{
  display:inline-block; border:2px solid var(--late); color:var(--late); border-radius:4px;
  padding:2px 9px; font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  transform:rotate(-3deg); font-family:var(--mono);
}
.kv{display:grid; grid-template-columns:118px 1fr; gap:8px 14px; font-size:13.5px; margin:0 0 18px}
.kv dt{color:var(--ink-3); font-size:11px; text-transform:uppercase; letter-spacing:.09em; padding-top:2px}
.kv dd{margin:0}
.trail{border-left:2px solid var(--rule); padding-left:14px; margin:0; list-style:none}
.trail li{margin-bottom:11px; font-size:13px}
.trail .t{font-family:var(--mono); font-size:11px; color:var(--ink-3); display:block}
.section-h{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3); margin:22px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--rule)}

/* ---------- modal ---------- */
.modal{
  position:fixed; z-index:70; top:50%; left:50%; transform:translate(-50%,-48%) scale(.98);
  width:min(620px,calc(100% - 32px)); max-height:86vh; overflow:auto;
  background:var(--surface); border:1px solid var(--rule); border-radius:10px; box-shadow:var(--shadow);
  opacity:0; pointer-events:none; transition:opacity .15s, transform .15s;
}
.modal.on{opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1)}
.modal h3{margin:0; font-family:var(--serif); font-size:19px; padding:16px 20px; border-bottom:1px solid var(--rule)}
.modal .mbody{padding:20px}

/* ---------- toast ---------- */
#toasts{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; gap:8px; align-items:center}
.toast{
  background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:20px; font-size:13.5px;
  box-shadow:var(--shadow); animation:pop .2s ease;
}
@keyframes pop{from{opacity:0; transform:translateY(8px)}}

/* ---------- email preview ---------- */
.mail{border:1px solid var(--rule); border-radius:8px; overflow:hidden; background:var(--paper)}
.mail .mh{padding:10px 14px; border-bottom:1px solid var(--rule); background:var(--surface-2); font-family:var(--mono); font-size:12px}
.mail pre{margin:0; padding:14px; white-space:pre-wrap; word-break:break-word; font-family:var(--mono); font-size:12.5px; line-height:1.6}

/* ---------- people table ---------- */
.tblwrap{overflow-x:auto}
table.data{border-collapse:collapse; width:100%; min-width:640px}
table.data th{
  text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3);
  padding:10px 14px; background:var(--surface-2); border-bottom:1px solid var(--rule); font-weight:600;
}
table.data td{padding:11px 14px; border-bottom:1px solid var(--rule); font-size:13.5px}
table.data td.num{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right}
.meter{height:6px; border-radius:3px; background:var(--surface-2); position:relative; min-width:74px}
.meter i{position:absolute; inset:0 auto 0 0; border-radius:3px; background:var(--accent)}
.meter.good i{background:var(--ready)} .meter.mid i{background:var(--soon)} .meter.bad i{background:var(--late)}

/* ---------- respond page ---------- */
.respond{max-width:560px; margin:0 auto; padding:44px 20px 80px}
.rcard{background:var(--surface); border:1px solid var(--rule); border-radius:10px; box-shadow:var(--shadow); overflow:hidden}
.rcard .rh{padding:20px; border-bottom:1px solid var(--rule)}
.rcard .rb{padding:20px}
.rtask{font-family:var(--serif); font-size:21px; line-height:1.35; margin:0 0 10px}
.rbtns{display:flex; flex-direction:column; gap:10px}
.rbtn{
  display:block; width:100%; text-align:left; padding:14px 16px; border-radius:8px; cursor:pointer;
  background:var(--paper); border:1px solid var(--rule-strong);
}
.rbtn:hover{border-color:var(--accent); background:var(--accent-2)}
.rbtn b{display:block; font-size:15px}
.rbtn span{display:block; font-size:12.5px; color:var(--ink-3); margin-top:2px}
.rbtn[data-k="ready"]:hover{border-color:var(--ready); background:var(--ready-bg)}
.rbtn[data-k="time"]:hover{border-color:var(--soon); background:var(--soon-bg)}
.rbtn[data-k="blocked"]:hover{border-color:var(--blocked); background:var(--blocked-bg)}
.codebox{font-family:var(--mono); font-size:12px; word-break:break-all; background:var(--paper); border:1px dashed var(--rule-strong); border-radius:var(--r); padding:12px}

.foot{margin-top:34px; padding-top:16px; border-top:1px solid var(--rule); color:var(--ink-3); font-size:12.5px}
.pill-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
.pill{
  background:var(--surface); border:1px solid var(--rule-strong); border-radius:20px; padding:5px 12px;
  font-size:12.5px; cursor:pointer; color:var(--ink-2);
}
.pill[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.cand{border:1px solid var(--rule); border-radius:8px; padding:14px; margin-bottom:12px; background:var(--paper)}
.cand .grid2{gap:10px}
</style>

<div id="app"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Commitment receipt"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div id="toasts" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ======================= storage ======================= */
var KEY = "taskchaser.v1";
var DEFAULTS = {
  settings: {
    ownerName: "", ownerEmail: "", org: "",
    cadence: [-2, 0, 1, 3, 7],
    defaultTone: "peer",
    linkBase: ""
  },
  items: [],
  ui: { view: "ledger", filter: "all", q: "", sort: "due" }
};
var state = null;

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var p = JSON.parse(raw);
      state = {
        settings: Object.assign({}, DEFAULTS.settings, p.settings || {}),
        items: Array.isArray(p.items) ? p.items : [],
        ui: Object.assign({}, DEFAULTS.ui, p.ui || {})
      };
      return;
    }
  }catch(e){}
  state = JSON.parse(JSON.stringify(DEFAULTS));
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({settings:state.settings, items:state.items, ui:state.ui})); }
  catch(e){ toast("Could not save locally. Storage may be full or blocked."); }
}

/* ======================= helpers ======================= */
function uid(){ return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function startOfDay(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
function dayDiff(iso){
  return Math.round((startOfDay(new Date(iso)) - startOfDay(new Date())) / 86400000);
}
function fmtDate(iso){
  if(!iso) return "no date";
  var d = new Date(iso);
  return d.toLocaleString(undefined, {weekday:"short", day:"numeric", month:"short", hour:"numeric", minute:"2-digit"});
}
function fmtShort(iso){
  if(!iso) return "-";
  var d = new Date(iso);
  return d.toLocaleDateString(undefined, {day:"2-digit", month:"short"}) + " " +
         d.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
}
function fmtStamp(iso){
  var d = new Date(iso);
  return d.toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"2-digit"}) + " " +
         d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function daysLabel(iso){
  var n = dayDiff(iso);
  if(n === 0) return "today";
  if(n === 1) return "in 1 day";
  if(n > 1) return "in " + n + " days";
  if(n === -1) return "1 day late";
  return Math.abs(n) + " days late";
}
function firstName(n){ return String(n||"").trim().split(/\s+/)[0] || "there"; }
function b64e(obj){
  var s = JSON.stringify(obj);
  var b = btoa(unescape(encodeURIComponent(s)));
  return b.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(str){
  var b = String(str).replace(/-/g,"+").replace(/_/g,"/");
  while(b.length % 4) b += "=";
  return JSON.parse(decodeURIComponent(escape(atob(b))));
}

/* ======================= date parsing ======================= */
var MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
var WDAYS = ["sun","mon","tue","wed","thu","fri","sat"];

function parseDate(input){
  if(!input) return null;
  var s = String(input).trim().toLowerCase();
  s = s.replace(/^(by|on|before|due|until|till|at)\s+/, "").trim();
  if(!s) return null;
  var now = new Date(), time = null, m;

  m = s.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);
  if(m){
    var h = parseInt(m[1],10) % 12;
    if(m[3] === "pm") h += 12;
    time = [h, m[2] ? parseInt(m[2],10) : 0];
    s = (s.slice(0,m.index) + " " + s.slice(m.index + m[0].length)).trim();
  } else {
    m = s.match(/\b(\d{1,2}):(\d{2})\b/);
    if(m){
      time = [parseInt(m[1],10), parseInt(m[2],10)];
      s = (s.slice(0,m.index) + " " + s.slice(m.index + m[0].length)).trim();
    }
  }
  s = s.replace(/\bat\b/g," ").replace(/[,]/g," ").replace(/\s+/g," ").trim();

  var d = null;
  if(/^(today|tonight|eod)$/.test(s)){
    d = new Date(now);
    if(s === "tonight" && !time) time = [20,0];
  } else if(/^tomorrow$/.test(s) || /^tmrw$/.test(s)){
    d = new Date(now); d.setDate(d.getDate()+1);
  } else if(/^day after tomorrow$/.test(s)){
    d = new Date(now); d.setDate(d.getDate()+2);
  } else if((m = s.match(/^in (\d+)\s*(day|days|week|weeks|month|months)$/))){
    d = new Date(now);
    var n = parseInt(m[1],10);
    if(/^day/.test(m[2])) d.setDate(d.getDate()+n);
    else if(/^week/.test(m[2])) d.setDate(d.getDate()+n*7);
    else d.setMonth(d.getMonth()+n);
  } else if((m = s.match(/^(next\s+|this\s+)?(sun|mon|tue|wed|thu|fri|sat)[a-z]*$/))){
    var target = WDAYS.indexOf(m[2]);
    d = new Date(now);
    var diff = (target - d.getDay() + 7) % 7;
    if(diff === 0) diff = 7;
    if(m[1] && m[1].trim() === "next") diff += 7;
    d.setDate(d.getDate() + diff);
  } else if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))){
    d = new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
  } else if((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?$/))){
    var yr = m[3] ? parseInt(m[3],10) : now.getFullYear();
    if(yr < 100) yr += 2000;
    d = new Date(yr, parseInt(m[2],10)-1, parseInt(m[1],10));
  } else if((m = s.match(/^(\d{1,2})(?:st|nd|rd|th)?\s+([a-z]{3,})\.?\s*(\d{4})?$/))){
    var mi = MONTHS.indexOf(m[2].slice(0,3));
    if(mi >= 0) d = new Date(m[3] ? parseInt(m[3],10) : now.getFullYear(), mi, parseInt(m[1],10));
  } else if((m = s.match(/^([a-z]{3,})\.?\s+(\d{1,2})(?:st|nd|rd|th)?\s*(\d{4})?$/))){
    var mj = MONTHS.indexOf(m[1].slice(0,3));
    if(mj >= 0) d = new Date(m[3] ? parseInt(m[3],10) : now.getFullYear(), mj, parseInt(m[2],10));
  }
  if(!d || isNaN(d.getTime())) return null;
  d.setHours(time ? time[0] : 17, time ? time[1] : 0, 0, 0);
  if(!/^\d{4}-/.test(s) && d < now && dayDiff(d.toISOString()) < -180) d.setFullYear(d.getFullYear()+1);
  return d.toISOString();
}

/* one-line capture: "Bilal Ahmed <bilal@x.pk> send the sponsor deck by friday 5pm" */
function parseQuick(line){
  var raw = String(line).trim();
  if(!raw) return null;
  var email = "", name = "", task = "", dueAt = null;

  var em = raw.match(/<([^>\s]+@[^>\s]+)>/) || raw.match(/([\w.+-]+@[\w-]+\.[\w.]+)/);
  if(em){
    email = em[1];
    name = raw.slice(0, em.index).trim().replace(/[,\-:]$/,"").trim();
    task = raw.slice(em.index + em[0].length).trim();
  } else {
    var sep = raw.match(/\s+(?:to|will|should|shall|owes me|is to|agreed to)\s+/i);
    if(sep){
      name = raw.slice(0, sep.index).trim();
      task = raw.slice(sep.index + sep[0].length).trim();
    } else {
      var colon = raw.indexOf(":");
      if(colon > 0 && colon < 40){ name = raw.slice(0,colon).trim(); task = raw.slice(colon+1).trim(); }
      else { name = ""; task = raw; }
    }
  }
  task = task.replace(/^(?:to|will|should|shall|is to|agreed to)\s+/i,"").trim();

  var byIdx = -1, mm, re = /\s+(?:by|before|due|on)\s+/gi;
  while((mm = re.exec(task)) !== null){ byIdx = mm.index; }
  if(byIdx >= 0){
    var datePart = task.slice(byIdx).replace(/^\s+(?:by|before|due|on)\s+/i,"");
    var iso = parseDate(datePart);
    if(iso){ dueAt = iso; task = task.slice(0, byIdx).trim(); }
  }
  if(!dueAt){
    var tail = task.match(/\s+(today|tonight|tomorrow|next\s+\w+|in\s+\d+\s+\w+|\d{1,2}[\/.\-]\d{1,2}(?:[\/.\-]\d{2,4})?|\d{4}-\d{1,2}-\d{1,2})\s*$/i);
    if(tail){
      var iso2 = parseDate(tail[1]);
      if(iso2){ dueAt = iso2; task = task.slice(0, tail.index).trim(); }
    }
  }
  if(!name && !task) return null;
  if(!name){ name = "Unnamed"; }
  if(!task){ task = "Unspecified commitment"; }
  if(!email) email = lookupEmail(name);
  return { name: name, email: email, task: task, dueAt: dueAt };
}

function lookupEmail(name){
  var key = String(name||"").trim().toLowerCase();
  for(var i = state.items.length - 1; i >= 0; i--){
    if(String(state.items[i].name).trim().toLowerCase() === key && state.items[i].email) return state.items[i].email;
  }
  return "";
}

/* ======================= model ======================= */
var KIND_ORDER = ["headsup","dueday","chase1","chase2","final"];
var KIND_LABEL = {headsup:"Heads-up", dueday:"Due-day check", chase1:"First chaser", chase2:"Second chaser", final:"Final chaser"};

function stateOf(it){
  if(it.status === "ready") return "ready";
  if(it.status === "blocked") return "blocked";
  var n = dayDiff(it.dueAt);
  if(n < 0) return "late";
  if(n <= 2) return "soon";
  return "open";
}
var STATE_LABEL = {ready:"Task ready", blocked:"Blocked", late:"Late", soon:"Due soon", open:"Open"};

function scheduleFor(it){
  var due = new Date(it.dueAt).getTime();
  return state.settings.cadence.map(function(off, i){
    return { i:i, offset:off, kind: KIND_ORDER[Math.min(i, KIND_ORDER.length-1)], at: new Date(due + off*86400000) };
  });
}
function sentSet(it){
  var s = {};
  (it.sent||[]).forEach(function(x){ s[x.i] = true; });
  return s;
}
function nextNudge(it){
  if(it.status !== "open") return null;
  var sched = scheduleFor(it), done = sentSet(it), now = Date.now(), i;
  for(i = 0; i < sched.length; i++){
    if(!done[sched[i].i] && sched[i].at.getTime() <= now) return sched[i];
  }
  return null;
}
function upcomingNudge(it){
  if(it.status !== "open") return null;
  var sched = scheduleFor(it), done = sentSet(it), now = Date.now(), i;
  for(i = 0; i < sched.length; i++){
    if(!done[sched[i].i] && sched[i].at.getTime() > now) return sched[i];
  }
  return null;
}
function chaseCount(it){ return (it.sent||[]).length; }
function isSilent(it){
  if(it.status !== "open") return false;
  if(chaseCount(it) < 2) return false;
  return !(it.log||[]).some(function(l){ return l.type === "reply"; });
}
function logAdd(it, type, text){
  it.log = it.log || [];
  it.log.push({ at: new Date().toISOString(), type: type, text: text });
}

function addItem(d){
  var it = {
    id: uid(),
    name: d.name || "Unnamed",
    email: d.email || "",
    task: d.task || "",
    dueAt: d.dueAt || new Date(Date.now()+2*86400000).toISOString(),
    originalDueAt: d.dueAt || new Date(Date.now()+2*86400000).toISOString(),
    tone: d.tone || state.settings.defaultTone,
    origin: d.origin || "",
    status: "open",
    slips: 0,
    blockedWhy: "",
    readyAt: null,
    createdAt: new Date().toISOString(),
    sent: [],
    log: []
  };
  logAdd(it, "created", "Logged" + (d.origin ? " from " + d.origin : ""));
  state.items.push(it);
  save();
  return it;
}
function getItem(id){
  for(var i=0;i<state.items.length;i++) if(state.items[i].id === id) return state.items[i];
  return null;
}
function markSent(it, entry){
  it.sent = it.sent || [];
  it.sent.push({ i: entry.i, kind: entry.kind, at: new Date().toISOString() });
  logAdd(it, "nudge", KIND_LABEL[entry.kind] + " sent");
  save();
}
function skipNudge(it, entry){
  it.sent = it.sent || [];
  it.sent.push({ i: entry.i, kind: entry.kind, at: new Date().toISOString(), skipped: true });
  logAdd(it, "nudge", KIND_LABEL[entry.kind] + " skipped");
  save();
}
function setReady(it, when, note){
  it.status = "ready";
  it.readyAt = when || new Date().toISOString();
  it.onTime = new Date(it.readyAt) <= new Date(it.originalDueAt);
  logAdd(it, "reply", "Marked task ready" + (note ? " - " + note : "") + (it.onTime ? " (on time)" : " (past the agreed date)"));
  save();
}
function reschedule(it, newIso, note){
  var old = it.dueAt;
  it.dueAt = newIso;
  it.status = "open";
  it.slips = (it.slips||0) + 1;
  it.sent = [];
  logAdd(it, "reschedule", "Date moved from " + fmtShort(old) + " to " + fmtShort(newIso) + (note ? " - " + note : ""));
  save();
}
function setBlocked(it, why){
  it.status = "blocked";
  it.blockedWhy = why || "";
  logAdd(it, "reply", "Reported blocked: " + (why || "no reason given"));
  save();
}
function reopen(it){
  it.status = "open";
  it.blockedWhy = "";
  it.readyAt = null;
  logAdd(it, "status", "Re-opened");
  save();
}

function linkBase(){

function replyLinks(it){
  var p = {

    e: state.settings.ownerEmail || ""
  };

function buildEmail(it, kind){
  var tone = TONES[it.tone] ? it.tone : "peer";
  var n = Math.abs(dayDiff(it.dueAt));
  var vars = {
    "{first}": firstName(it.name),
    "{name}": it.name,
    "{owner}": state.settings.ownerName || "(set your name in Settings)",
    "{orgline}": state.settings.org ? "\n" + state.settings.org : "",
    "{date}": fmtDate(it.dueAt),
    "{shortdate}": new Date(it.dueAt).toLocaleDateString(undefined,{day:"numeric",month:"short"}),
    "{task}": it.task,
    "{n}": String(n)
  };
  function fill(s){
    return String(s).replace(/\{first\}|\{name\}|\{owner\}|\{orgline\}|\{date\}|\{shortdate\}|\{task\}|\{n\}/g, function(m){ return vars[m]; });
  }
  var L = replyLinks(it);
  var subject = fill(SUBJ[kind] || SUBJ.chase1);
  var body =
    fill(TONES[tone].greet) + "\n\n" +
    fill(LINES[kind] ? LINES[kind][tone] : LINES.chase1[tone]) + "\n\n" +
    "TASK: " + it.task + "\n" +

    "Need more time, pick a time and date: " + L.time + "\n" +
    "Task blocked, say why: " + L.blocked + "\n\n" +
    fill(TONES[tone].sign);
  return { to: it.email, subject: subject, body: body };
}
function mailtoHref(m){

/* ======================= reply codes ======================= */
function makeCode(payload){ return "TCR1." + b64e(payload); }
function readCode(str){
  var s = String(str||"").trim();
  var m = s.match(/TCR1\.([A-Za-z0-9\-_]+)/);
  if(!m) return null;
  try{ return b64d(m[1]); }catch(e){ return null; }
}
function applyCode(str){
  var p = readCode(str);
  if(!p) return { ok:false, msg:"That does not look like a TaskChaser reply code." };
  var it = getItem(p.i);
  if(!it) return { ok:false, msg:"No matching commitment in this ledger. The code may be from another device." };
  if(p.a === "ready"){ setReady(it, p.at, "reply link"); return { ok:true, msg:"Marked ready: " + it.task, id:it.id }; }
  if(p.a === "time"){
    if(!p.v) return { ok:false, msg:"The code has no new date in it." };
    reschedule(it, p.v, "new date given by " + it.name);
    return { ok:true, msg:"Rescheduled to " + fmtShort(p.v), id:it.id };
  }
  if(p.a === "blocked"){ setBlocked(it, p.v || ""); return { ok:true, msg:"Marked blocked: " + it.task, id:it.id }; }
  return { ok:false, msg:"Unknown reply type." };
}

/* ======================= people stats ======================= */
function peopleStats(){
  var map = {};
  state.items.forEach(function(it){
    var key = (it.email || it.name).toLowerCase();
    if(!map[key]) map[key] = { name: it.name, email: it.email, logged:0, closed:0, onTime:0, slips:0, chases:0, open:0, late:0, slipDays:0, items:[] };
    var r = map[key];
    r.name = it.name; if(it.email) r.email = it.email;
    r.logged++;
    r.slips += (it.slips||0);
    r.chases += chaseCount(it);
    r.items.push(it);
    if(it.status === "ready"){ r.closed++; if(it.onTime) r.onTime++; }
    else if(it.status === "open"){
      r.open++;
      if(dayDiff(it.dueAt) < 0) r.late++;
    }
    if(it.slips){
      r.slipDays += Math.max(0, Math.round((new Date(it.dueAt) - new Date(it.originalDueAt))/86400000));
    }
  });
  return Object.keys(map).map(function(k){
    var r = map[k];
    r.avgChases = r.logged ? r.chases / r.logged : 0;
    r.onTimeRate = r.closed ? r.onTime / r.closed : null;
    r.buffer = r.slips ? Math.ceil(r.slipDays / r.slips) : 0;
    r.score = r.closed ? Math.round(100 * (0.6*r.onTimeRate + 0.4*(1/(1+r.avgChases)))) : null;
    return r;
  }).sort(function(a,b){
    if(a.score === null && b.score === null) return b.logged - a.logged;
    if(a.score === null) return 1;
    if(b.score === null) return -1;
    return a.score - b.score;
  });
}

function copyText(text, okMsg){
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.top = "-1000px";
    document.body.appendChild(ta); ta.focus(); ta.select();
    var done = false;
    try{ done = document.execCommand("copy"); }catch(e){}
    ta.remove();
    toast(done ? (okMsg || "Copied") : "Copy blocked by the browser. Select the text and press Ctrl+C.");
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg || "Copied"); }, fallback);
  } else fallback();
}

var candidates = [];
function extractLines(text){
  var out = [];
  String(text).split(/\r?\n/).forEach(function(raw){
    var line = raw.replace(/^\s*(?:[-*•–]|\d+[.)])\s*/, "").trim();
    if(line.length < 8) return;
    if(!/\b(to|will|shall|should|owes|agreed|by|before|due|send|share|sign|deliver|confirm|revert|prepare|update|pay|submit)\b/i.test(line)) return;
    var p = parseQuick(line);
    if(p && p.name && p.name !== "Unnamed" && p.task) out.push(p);
  });
  return out;
}

function toneOptions(sel){
  return Object.keys(TONES).map(function(k){
    return '<option value="' + k + '"' + (sel === k ? " selected" : "") + '>' + TONES[k].label + '</option>';
  }).join("");

function toLocalInput(iso){
  if(!iso) return "";
  var d = new Date(iso);
  var pad = function(n){ return String(n).padStart(2,"0"); };
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function fromLocalInput(v){
  if(!v) return null;
  var d = new Date(v);
  return isNaN(d.getTime()) ? null : d.toISOString();
}

/* ======================= render: digest ======================= */
function buildDigest(){
  var c = counts();
  var late = [], week = [], blocked = [], silent = [], readyRecent = [];
  var weekEnd = Date.now() + 7*86400000;
  state.items.forEach(function(it){
    var s = stateOf(it);
    if(s === "late") late.push(it);
    else if(it.status === "open" && new Date(it.dueAt).getTime() <= weekEnd) week.push(it);
    if(s === "blocked") blocked.push(it);
    if(isSilent(it)) silent.push(it);
    if(it.status === "ready" && it.readyAt && (Date.now() - new Date(it.readyAt).getTime()) < 7*86400000) readyRecent.push(it);
  });
  late.sort(function(a,b){ return new Date(a.dueAt) - new Date(b.dueAt); });
  week.sort(function(a,b){ return new Date(a.dueAt) - new Date(b.dueAt); });

  var L = [];
  L.push("TASKCHASER DIGEST - " + new Date().toLocaleDateString(undefined,{weekday:"long", day:"numeric", month:"long", year:"numeric"}));
  L.push("");
  L.push(c.open + " open, " + c.late + " late, " + c.blocked + " blocked, " + readyRecent.length + " closed this week.");
  L.push("");
  if(late.length){
    L.push("LATE (" + late.length + ")");
    late.forEach(function(it){ L.push("  - " + it.name + ": " + it.task + " (" + daysLabel(it.dueAt) + ", " + chaseCount(it) + " chasers sent)"); });
    L.push("");
  }
  if(week.length){
    L.push("DUE IN THE NEXT 7 DAYS (" + week.length + ")");
    week.forEach(function(it){ L.push("  - " + it.name + ": " + it.task + " (" + fmtShort(it.dueAt) + ")"); });
    L.push("");
  }
  if(blocked.length){
    L.push("BLOCKED, NEEDS YOU (" + blocked.length + ")");
    blocked.forEach(function(it){ L.push("  - " + it.name + ": " + it.task + " -> " + (it.blockedWhy || "no reason given")); });
    L.push("");
  }
  if(silent.length){
    L.push("NO REPLY AFTER 2+ CHASERS (" + silent.length + ")");
    silent.forEach(function(it){ L.push("  - " + it.name + ": " + it.task); });
    L.push("");
  }
  if(readyRecent.length){
    L.push("CLOSED THIS WEEK (" + readyRecent.length + ")");
    readyRecent.forEach(function(it){ L.push("  - " + it.name + ": " + it.task + (it.onTime ? " (on time)" : " (late)")); });
    L.push("");
  }
  var risky = peopleStats().filter(function(r){ return r.score !== null && r.score < 55; });
  if(risky.length){
    L.push("ADD A BUFFER WITH");
    risky.forEach(function(r){ L.push("  - " + r.name + ": score " + r.score + ", suggested buffer +" + (r.buffer||1) + " day(s)"); });
  }
  if(L[L.length-1] === "") L.pop();
  return L.join("\n");
}
function renderDigest(){
  var text = buildDigest();
  $("#viewRoot").innerHTML =
  '<div class="panel"><div class="phead">Weekly digest' +
    '<div style="margin-left:auto; display:flex; gap:8px">' +
      '<button class="btn sm" data-act="copy-digest">Copy digest</button>' +
      '<a class="btn sm" href="' + esc("mailto:" + encodeURIComponent(state.settings.ownerEmail||"") + "?subject=" + encodeURIComponent("TaskChaser digest") + "&body=" + encodeURIComponent(text)) + '">Mail it to myself</a>' +
    '</div></div>' +

    '<p class="hint">Built live from the ledger. Paste it into a status update, or mail it to yourself as a Monday brief.</p></div></div>';
}

      (un ? '<p class="hint">Next one is queued for ' + esc(fmtShort(un.at.toISOString())) + '.</p>' : '')) +

    '<div class="section-h">Reply links for this item</div>' +
    '<p class="hint" style="margin-top:0">These are the exact buttons the recipient gets. Test one yourself.</p>' +
    '<div class="rbtns" style="gap:6px">' +
      '<a class="btn sm" href="' + esc(L.ready) + '">Task ready</a>' +
      '<a class="btn sm" href="' + esc(L.time) + '">Need more time, pick a time and date</a>' +
      '<a class="btn sm" href="' + esc(L.blocked) + '">Task blocked, say why</a>' +
    '</div>' +

    '<div class="section-h">Receipt trail</div>' +
    '<ul class="trail">' +
      (it.log||[]).slice().reverse().map(function(l){
        return '<li><span class="t">' + esc(fmtStamp(l.at)) + ' &middot; ' + esc(l.type) + '</span>' + esc(l.text) + '</li>';
      }).join("") +
    '</ul>' +
  '</div>';

  $("#drawer").innerHTML = html;
  $("#drawer").classList.add("on");
  $("#scrim").classList.add("on");
}

/* ======================= modals ======================= */
function modalChase(id){
  var it = getItem(id);

  openModal(KIND_LABEL[n.kind] + " to " + it.name,
    '<div class="mail"><div class="mh">To: ' + esc(m.to || "no email on file") + '<br />Subject: ' + esc(m.subject) + '</div>' +
    '<pre id="mailbody">' + esc(m.body) + '</pre></div>' +
    '<div class="actions">' +
      '<a class="btn primary" href="' + esc(mailtoHref(m)) + '">Open in mail app</a>' +
      '<button class="btn" data-act="copy-mail" data-id="' + it.id + '" data-i="' + n.i + '">Copy email text</button>' +
      '<button class="btn" data-act="sent" data-id="' + it.id + '" data-i="' + n.i + '">Mark as sent</button>' +
      '<button class="btn ghost" data-act="close-modal">Close</button>' +
    '</div>' +

      '<div class="grid2">' +
        '<div><label class="f" for="e_due">Agreed date and time</label><input class="t" id="e_due" type="datetime-local" required value="' + esc(it ? toLocalInput(it.dueAt) : toLocalInput(new Date(Date.now()+3*86400000).setHours(17,0,0,0))) + '" /></div>' +

function modalReplyCode(){

function modalDate(id, mode){

/* ======================= respond page ======================= */
function renderRespond(){
  var hash = location.hash.slice("#respond=".length);
  var action = "";
  var amp = hash.indexOf("&a=");
  if(amp >= 0){ action = hash.slice(amp+3); hash = hash.slice(0, amp); }
  var p = null;
  try{ p = b64d(hash); }catch(e){}
  var app = $("#app");

  if(!p || !p.t){
    app.innerHTML = '<div class="respond"><div class="rcard"><div class="rb">' +
      '<h2 class="rtask">This reply link is not readable</h2>' +
      '<p>The address may have been cut short by a mail app. Reply to the sender directly instead.</p>' +
      '<div class="actions"><a class="btn" href="' + esc(location.href.split("#")[0]) + '">Open TaskChaser</a></div>' +
      '</div></div></div>';
    return;
  }

  var owner = p.o || "the sender";
  var body =
    '<div class="rh">' +
      '<div class="mono" style="font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)">Status check from ' + esc(owner) + '</div>' +
      '<h2 class="rtask" style="margin-top:8px">' + esc(p.t) + '</h2>' +
      '<div class="mono" style="font-size:12.5px; color:var(--ink-2)">Agreed date: ' + esc(fmtDate(p.d)) + '</div>' +
    '</div>' +
    '<div class="rb" id="rbody"></div>';
  app.innerHTML = '<div class="respond"><div class="rcard">' + body + '</div>' +
    '<p class="hint" style="text-align:center; margin-top:18px">One tap, no account, nothing installed.<br />' +
    '<button class="btn ghost sm" data-act="exit-respond" style="margin-top:10px">Back to TaskChaser</button></p></div>';

  var rb = $("#rbody");

  function chooser(){
    rb.innerHTML = '<div class="rbtns">' +
      '<button class="rbtn" data-k="ready"><b>Task ready</b><span>It is done and with ' + esc(owner) + '</span></button>' +
      '<button class="rbtn" data-k="time"><b>Need more time, pick a time and date</b><span>Give a new date you can hold</span></button>' +
      '<button class="rbtn" data-k="blocked"><b>Task blocked, say why</b><span>Something is stopping you</span></button>' +
      '</div>';
  }
  function finish(payload, line){
    var code = makeCode(payload);
    var subject = "Re: " + p.t;
    var mailBody = line + "\n\n---- TaskChaser reply code, please keep this line ----\n" + code + "\n";
    var href = "mailto:" + encodeURIComponent(p.e || "") + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(mailBody);
    rb.innerHTML =
      '<div style="margin-bottom:16px"><strong>Recorded.</strong> Send it to ' + esc(owner) + ' with the button below, or copy the code and paste it into any reply.</div>' +
      '<div class="mail" style="margin-bottom:14px"><div class="mh">To: ' + esc(p.e || "the sender") + '<br />Subject: ' + esc(subject) + '</div><pre>' + esc(mailBody) + '</pre></div>' +
      '<div class="actions" style="margin-top:0">' +
        '<a class="btn primary" href="' + esc(href) + '">Send the reply</a>' +
        '<button class="btn" data-act="copy-reply">Copy the code</button>' +
        '<button class="btn ghost" data-act="respond-back">Change my answer</button>' +
      '</div>';
    rb.querySelector('[data-act="copy-reply"]').addEventListener("click", function(){ copyText(code, "Reply code copied"); });
    rb.querySelector('[data-act="respond-back"]').addEventListener("click", chooser);
  }
  function pick(k){
    if(k === "ready"){
      finish({i:p.i, a:"ready", at:new Date().toISOString()}, "Task ready. This is done and with you.");
    } else if(k === "time"){
      var def = new Date(Date.now()+3*86400000); def.setHours(17,0,0,0);
      rb.innerHTML = '<div class="formrow"><label class="f" for="nd">New date and time you can hold</label>' +
        '<input class="t" id="nd" type="datetime-local" value="' + esc(toLocalInput(def.toISOString())) + '" /></div>' +
        '<div class="actions"><button class="btn primary" id="ndgo">Confirm the new date</button>' +
        '<button class="btn ghost" id="ndback">Back</button></div>';
      $("#ndgo").addEventListener("click", function(){
        var iso = fromLocalInput($("#nd").value);
        if(!iso){ toast("Pick a date and time first."); return; }
        finish({i:p.i, a:"time", v:iso, at:new Date().toISOString()},
          "I need more time. New date: " + fmtDate(iso) + ".");
      });
      $("#ndback").addEventListener("click", chooser);
    } else {
      rb.innerHTML = '<div class="formrow"><label class="f" for="why">What is blocking it?</label>' +
        '<textarea class="t" id="why" style="min-height:90px" placeholder="Waiting on the signed contract from legal"></textarea></div>' +
        '<div class="actions"><button class="btn primary" id="whygo">Send the blocker</button>' +
        '<button class="btn ghost" id="whyback">Back</button></div>';
      $("#whygo").addEventListener("click", function(){
        var w = $("#why").value.trim();
        if(!w){ toast("Say what is blocking it, one line is enough."); return; }
        finish({i:p.i, a:"blocked", v:w, at:new Date().toISOString()}, "Task blocked: " + w);
      });
      $("#whyback").addEventListener("click", chooser);
    }
  }
  rb.addEventListener("click", function(ev){
    var b = ev.target.closest(".rbtn");
    if(b) pick(b.getAttribute("data-k"));
  });
  chooser();
  if(action === "ready" || action === "time" || action === "blocked") pick(action);
}

/* ======================= events ======================= */
document.addEventListener("click", function(ev){
  var t = ev.target;

  var tab = t.closest("nav.tabs button");
  if(tab){ state.ui.view = tab.getAttribute("data-view"); save(); render(); return; }

  var pill = t.closest(".pill[data-filter]");
  if(pill){ state.ui.filter = pill.getAttribute("data-filter"); save(); renderView(); return; }

  var el = t.closest("[data-act]");
  if(el){
    var act = el.getAttribute("data-act");
    var id = el.getAttribute("data-id");
    var idx = el.getAttribute("data-i");
    var ci = el.getAttribute("data-ci");

    if(act === "mail"){
      toast("Press Mark as sent once it has gone");
      return; /* let the anchor do its job */
    }

    ev.preventDefault();

    if(act === "open"){ openDrawer(id); }
    else if(act === "close-drawer"){ closeDrawer(); }
    else if(act === "close-modal"){ closeModal(); }
    else if(act === "exit-respond"){ location.hash = ""; render(); }
    else if(act === "full-form"){ modalEdit(null); }
    else if(act === "reply-code"){ modalReplyCode(); }
    else if(act === "chase"){ modalChase(id); }
    else if(act === "seed"){ seed(); state.ui.view = "ledger"; render(); }
    else if(act === "copy-mail"){
      var it1 = getItem(id);
      var e1 = scheduleFor(it1)[parseInt(idx,10)];
      var m1 = buildEmail(it1, e1.kind);
      copyText("To: " + (m1.to||"") + "\nSubject: " + m1.subject + "\n\n" + m1.body, "Chaser copied");
    }
    else if(act === "sent"){
      var it2 = getItem(id);
      var e2 = scheduleFor(it2)[parseInt(idx,10)];
      markSent(it2, e2); closeModal();
      if(state.ui.openId === id) openDrawer(id);
      renderThenNav(); toast("Chaser recorded as sent");
    }
    else if(act === "skip"){
      var it3 = getItem(id);
      var e3 = scheduleFor(it3)[parseInt(idx,10)];
      skipNudge(it3, e3); renderThenNav(); toast("Skipped");
    }
    else if(act === "mark-ready"){ setReady(getItem(id), null, "marked by you"); openDrawer(id); renderThenNav(); toast("Marked ready"); }
    else if(act === "mark-time"){ modalDate(id, "time"); }
    else if(act === "mark-blocked"){ modalDate(id, "blocked"); }
    else if(act === "do-time"){
      var iso = fromLocalInput($("#d_new").value);
      if(!iso){ toast("Pick a valid date."); return; }
      reschedule(getItem(id), iso, $("#d_note").value.trim());
      closeModal(); openDrawer(id); renderThenNav(); toast("Date moved");
    }
    else if(act === "do-blocked"){
      setBlocked(getItem(id), $("#d_why").value.trim());
      closeModal(); openDrawer(id); renderThenNav(); toast("Marked blocked");
    }
    else if(act === "reopen"){ reopen(getItem(id)); openDrawer(id); renderThenNav(); }
    else if(act === "edit"){ modalEdit(id); }
    else if(act === "remove"){
      var it4 = getItem(id);
      if(!it4) return;
      if(el.getAttribute("data-armed")){
        state.items = state.items.filter(function(x){ return x.id !== id; });
        save(); closeDrawer(); renderThenNav(); toast("Removed");
      } else {
        el.setAttribute("data-armed","1"); el.textContent = "Press again to remove";
      }
    }
    else if(act === "do-code"){
      var r = applyCode($("#codebox").value);
      toast(r.msg);
      if(r.ok){ closeModal(); renderThenNav(); if(r.id) openDrawer(r.id); }
    }
    else if(act === "extract"){
      candidates = extractLines($("#mintext").value);
      var keep = $("#mintext").value;
      renderCapture();
      $("#mintext").value = keep;
      toast(candidates.length ? "Found " + candidates.length : "No commitments could be read from that text");
    }
    else if(act === "clear-extract"){ candidates = []; renderCapture(); }
    else if(act === "add-one"){
      var c1 = candidates[parseInt(ci,10)];
      if(c1){ addItem(c1); candidates.splice(parseInt(ci,10),1); renderCapture(); toast("Logged"); }
    }
    else if(act === "drop-one"){ candidates.splice(parseInt(ci,10),1); renderCapture(); }
    else if(act === "add-all"){
      var n = candidates.length;
      candidates.forEach(function(c){ addItem(c); });
      candidates = [];
      state.ui.view = "ledger"; render(); toast(n + " logged");
    }
    else if(act === "copy-digest"){ copyText(buildDigest(), "Digest copied"); }
    else if(act === "copy-export"){ copyText($("#exportbox").value, "Backup copied"); }
    else if(act === "copy-all-chasers"){
      var out = [];
      state.items.forEach(function(it){
        var nn = nextNudge(it);
        if(!nn) return;
        var m = buildEmail(it, nn.kind);
        out.push("=== " + it.name + " <" + (it.email||"no email") + "> ===\nSubject: " + m.subject + "\n\n" + m.body + "\n");
      });
      copyText(out.join("\n"), out.length + " chasers copied");
    }
    else if(act === "import"){
      try{
        var p = JSON.parse($("#importbox").value);
        if(!p || !Array.isArray(p.items)) throw new Error("bad");
        state.items = p.items;
        state.settings = Object.assign({}, DEFAULTS.settings, p.settings || {});
        save(); render(); toast("Restored " + p.items.length + " items");
      }catch(e){ toast("That text is not a valid TaskChaser backup."); }
    }
    else if(act === "wipe"){
      if(el.getAttribute("data-armed")){
        state = JSON.parse(JSON.stringify(DEFAULTS)); save(); render(); toast("Everything erased");
      } else { el.setAttribute("data-armed","1"); el.textContent = "Press again to erase everything"; }
    }
    else if(act === "save-settings"){
      var s = state.settings;
      s.ownerName = $("#setName").value.trim();
      s.ownerEmail = $("#setEmail").value.trim();
      s.org = $("#setOrg").value.trim();
      s.defaultTone = $("#setTone").value;
      s.linkBase = $("#setBase").value.trim();
      var cad = $("#setCadence").value.split(",").map(function(x){ return parseInt(x.trim(),10); }).filter(function(x){ return !isNaN(x); });
      if(cad.length) s.cadence = cad;
      save(); render(); toast("Settings saved");
    }
    return;
  }

  var row = t.closest(".row[data-id]");
  if(row){ openDrawer(row.getAttribute("data-id")); return; }

  if(t.id === "scrim"){ closeModal(); closeDrawer(); }
});

function renderThenNav(){ render(); }

document.addEventListener("submit", function(ev){
  if(ev.target.id === "quickform"){
    ev.preventDefault();
    var v = $("#quickinput").value;
    var p = parseQuick(v);
    if(!p){ toast("Type something like: Sara Khan <sara@x.com> send the quote by friday"); return; }
    if(!p.dueAt){
      $("#quickinput").value = "";
      candidates = [p];
      state.ui.view = "capture";
      render(); renderCapture();
      toast("No date found. Set one below, then log it.");
      return;
    }
    addItem(p);
    $("#quickinput").value = "";
    state.ui.view = "ledger"; state.ui.focusQuick = true;
    render();
    toast("Logged: " + p.name + " by " + fmtShort(p.dueAt));
    return;
  }
  if(ev.target.id === "editform"){
    ev.preventDefault();
    var idEl = $("#e_id");
    var due = fromLocalInput($("#e_due").value);
    if(!due){ toast("Pick a date and time."); return; }
    if(idEl){
      var it = getItem(idEl.value);
      it.name = $("#e_name").value.trim();
      it.email = $("#e_email").value.trim();
      it.task = $("#e_task").value.trim();
      it.tone = $("#e_tone").value;
      it.origin = $("#e_origin").value.trim();
      if(it.dueAt !== due){
        logAdd(it, "edit", "Date changed to " + fmtShort(due));
        it.dueAt = due;
      } else logAdd(it, "edit", "Details edited");
      save(); closeModal(); openDrawer(it.id); renderThenNav(); toast("Saved");
    } else {
      var nw = addItem({
        name: $("#e_name").value.trim(), email: $("#e_email").value.trim(),
        task: $("#e_task").value.trim(), dueAt: due,
        tone: $("#e_tone").value, origin: $("#e_origin").value.trim()
      });
      closeModal(); state.ui.view = "ledger"; render(); toast("Logged");
    }
  }
});

document.addEventListener("input", function(ev){
  if(ev.target.id === "search"){
    state.ui.q = ev.target.value;
    renderView();
    return;
  }
  var cf = ev.target.getAttribute && ev.target.getAttribute("data-cf");
  if(cf){
    var i = parseInt(ev.target.getAttribute("data-ci"),10);
    if(candidates[i]) candidates[i][cf] = cf === "dueAt" ? fromLocalInput(ev.target.value) : ev.target.value;
  }
});
document.addEventListener("change", function(ev){
  if(ev.target.id === "sortsel"){ state.ui.sort = ev.target.value; save(); renderView(); }
});
document.addEventListener("keydown", function(ev){
  if(ev.key === "Escape"){ closeModal(); closeDrawer(); }
  if(ev.key === "Enter" && ev.target.classList && ev.target.classList.contains("row")){
    openDrawer(ev.target.getAttribute("data-id"));
  }
});
window.addEventListener("hashchange", function(){ render(); });

/* ======================= boot ======================= */
load();
render();
})();
</script>
